name: Build Sandbox Image

on:
  push:
    branches:
      - main
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/remediation-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0

      # The tag matches the CODING_AGENT build argument: one image variant per
      # coding agent, per sandbox/Dockerfile. Pushed with GITHUB_TOKEN so the
      # package inherits this repository's visibility, like every other image
      # in the project — manual docker pushes create private packages.
      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:opencode
          build-args: CODING_AGENT=opencode
          cache-from: type=gha
          cache-to: type=gha,mode=max
