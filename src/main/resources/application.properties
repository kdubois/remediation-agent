# Remediation agent configuration
quarkus.http.port=8080
quarkus.application.name=remediation-agent

# A2A server (agent card URL, JSON-RPC endpoint mounted by the SDK)
a2a.agent.url=http://remediation-agent
quarkus.agentcard.protocol=JSONRPC
a2a.authorization.required=false

# Sandbox runtime: the image tag selects the coding agent
remediation.sandbox.image=ghcr.io/kdubois/remediation-sandbox:opencode
remediation.sandbox.coding-agent=opencode
remediation.sandbox.github-secret-name=remediation-agent
remediation.sandbox.github-secret-key=github_token
remediation.sandbox.timeout-seconds=2400

# Only these repositories may be remediated — validated before any sandbox runs
remediation.allowed-repos=https://github.com/kdubois/argo-rollouts-quarkus-demo

# GitHub access for PR/issue creation
github.token=${GITHUB_TOKEN:}
quarkus.rest-client.github-api.url=https://api.github.com


# Logging
quarkus.log.level=INFO
quarkus.log.category."dev.kevindubois.remediation".level=INFO
