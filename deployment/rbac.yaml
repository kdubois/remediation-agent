apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-agent
  namespace: remediation-system
---
# The service creates Sandbox resources and reads their pod logs. Scoped to the
# sandbox namespace; the service has no permissions in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-agent-sandboxes
  namespace: remediation
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-agent-sandboxes
  namespace: remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-agent-sandboxes
subjects:
- kind: ServiceAccount
  name: remediation-agent
  namespace: remediation-system
